# 경로 기반 서비스 라우팅 — 클라이언트는 도메인 하나만 본다.
# *.교회도메인/api/members/* → members, /api/finance/* → finance, 나머지 → web

upstream web_upstream     { server web:4000; }
upstream members_upstream { server members:4100; }
upstream finance_upstream { server finance:4200; }

server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  # 테넌트 식별에 원래 Host가 필요하므로 반드시 전달
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/members/ {
    proxy_pass http://members_upstream;
  }

  location /api/finance/ {
    proxy_pass http://finance_upstream;
  }

  location / {
    proxy_pass http://web_upstream;
  }
}
