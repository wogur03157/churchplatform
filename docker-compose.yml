# 전체 스택 실행:  docker compose up -d
# 특정 앱만 재배포: docker compose up -d --build finance
#
# 환경변수는 .env.docker 파일에서 읽는다 (.env.docker.example 참고)

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: admin_dashboard
    volumes:
      - dbdata:/var/lib/mysql
      # 최초 기동 시 중앙 DB 스키마 자동 생성
      - ./z_docs/db-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args: { APP: web }
    restart: unless-stopped
    env_file: .env.docker
    environment:
      PORT: "4000"
    volumes:
      - uploads:/repo/apps/web/uploads
    depends_on:
      mysql: { condition: service_healthy }

  members:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args: { APP: members }
    restart: unless-stopped
    env_file: .env.docker
    environment:
      PORT: "4100"
    depends_on:
      mysql: { condition: service_healthy }

  finance:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args: { APP: finance }
    restart: unless-stopped
    env_file: .env.docker
    environment:
      PORT: "4200"
    depends_on:
      mysql: { condition: service_healthy }

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, members, finance]

volumes:
  dbdata:
  uploads:
